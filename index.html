  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: #13131a; --accent: #f5a623;
      --accent2: #e05c5c; --text: #f0ede8; --muted: #7a7a8a;
      --border: rgba(245,166,35,0.15);
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 20% 20%, rgba(245,166,35,0.07) 0%, transparent 60%), radial-gradient(ellipse 50% 60% at 80% 80%, rgba(224,92,92,0.06) 0%, transparent 60%); pointer-events: none; z-index: 0; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 40px 24px 60px; display: flex; flex-direction: column; align-items: center; }
    .avatar-wrap { position: relative; margin-bottom: 24px; animation: fadeDown 0.7s ease both; }
    .avatar-ring { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); padding: 3px; display: flex; align-items: center; justify-content: center; }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; color: var(--accent); }
    .status-dot { position: absolute; bottom: 5px; right: 5px; width: 16px; height: 16px; background: #4ade80; border-radius: 50%; border: 3px solid var(--bg); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    .name { font-family: 'Playfair Display', serif; font-size: 2.1rem; font-weight: 900; text-align: center; animation: fadeDown 0.7s 0.1s ease both; }
    .name span { color: var(--accent); }
    .tagline { margin-top: 10px; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; animation: fadeDown 0.7s 0.2s ease both; }
    .divider { width: 40px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); margin: 24px auto; border-radius: 2px; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .link-btn { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; text-decoration: none; color: var(--text); font-weight: 500; transition: all 0.25s ease; position: relative; overflow: hidden; }
    .link-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .link-btn.whatsapp:hover { border-color: rgba(37,211,102,0.4); }
    .link-btn.whatsapp .icon { background: #25D366; }
    .link-btn.instagram:hover { border-color: rgba(225,48,108,0.4); }
    .link-btn.instagram .icon { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .link-btn.linkedin:hover { border-color: rgba(0,119,181,0.4); }
    .link-btn.linkedin .icon { background: #0077B5; }
    .icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon svg { width: 23px; height: 23px; fill: white; }
    .link-info { flex: 1; }
    .link-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
    .link-name { font-size: 1rem; font-weight: 500; }
    .arrow { color: var(--muted); font-size: 1.2rem; transition: transform 0.2s, color 0.2s; }
    .link-btn:hover .arrow { transform: translateX(5px); color: var(--accent); }
    .footer { margin-top: 44px; font-size: 0.72rem; color: var(--muted); opacity: 0.4; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
